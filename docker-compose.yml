version: '3.8'

services:
  # --- CÂU 81 + 83 + 85: CẤU HÌNH BACKEND ---
  backend:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb+srv://<username>:<password>@cluster0.xxxxx.mongodb.net/test?retryWrites=true&w=majority
    networks:
      - mern-network

  # --- CÂU 82 + 84: CẤU HÌNH FRONTEND ---
  frontend:
    build: ./client
    ports:
      - "3000:80"
    networks:
      - mern-network

networks:
  mern-network:
    driver: bridge